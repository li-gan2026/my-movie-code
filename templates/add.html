<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>添加新电影</title>
    <!-- 引入我们之前的 Bootstrap 样式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 600px;">
    <h2>🎬 添加新电影</h2>
    
    <!-- 这里的 method 必须是 POST，action 提交给后端的 /add 路由 -->
    <form action="/add" method="POST" class="mt-4">
        <div class="mb-3">
            <label class="form-label">电影名称</label>
            <input type="text" class="form-control" name="title" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">评分（比如 8.8）</label>
            <!-- step="0.1" 允许输入一位小数 -->
            <input type="number" step="0.1" class="form-control" name="rating" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">经典引言</label>
            <textarea class="form-control" name="quote" rows="3"></textarea>
        </div>
        
        <button type="submit" class="btn btn-success">保存入库</button>
        <a href="/" class="btn btn-secondary">返回首页</a >
    </form>
</body>
</html>
