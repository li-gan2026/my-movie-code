<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 400px;">
    <h2>📝 注册新账号</h2>
    <form action="/register" method="POST" class="mt-3">
        <input type="text" name="username" class="form-control mb-2" placeholder="用户名" required>
        <input type="password" name="password" class="form-control mb-2" placeholder="密码" required>
        <button type="submit" class="btn btn-success w-100">注册</button>
    </form>
    <p class="mt-3">已有账号？<a href="/login ">去登录</a ></p >
</body>
</html>
