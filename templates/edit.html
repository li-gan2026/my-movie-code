<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>修改电影</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 600px;">
    <h2>✏️ 修改电影信息</h2>
    
    <!-- 注意这里的 action 带上了 movie.id -->
    <form action="/edit/{{ movie.id }}" method="POST" class="mt-4">
        <div class="mb-3">
            <label class="form-label">电影名称</label>
            <!-- value 里面填上了原来的名字 -->
            <input type="text" class="form-control" name="title" value="{{ movie.title }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">评分</label>
            <input type="number" step="0.1" class="form-control" name="rating" value="{{ movie.rating }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">经典引言</label>
            <!-- textarea 的默认值要写在两个标签中间 -->
            <textarea class="form-control" name="quote" rows="3">{{ movie.quote }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">保存修改</button>
        <a href=" " class="btn btn-secondary">取消返回</a >
    </form>
</body>
</html>
